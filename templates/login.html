<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <title>Ingresar — CEA La 30</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/k-favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/k-192.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/k-apple-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v=asset_v) }}">
  <script>(function(){try{var t=localStorage.getItem('tema');if(t==='night'||t==='light'){document.documentElement.setAttribute('data-theme',t);}var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',document.documentElement.getAttribute('data-theme')==='night'?'#080c14':'#f7f5f0');}}catch(e){}})();</script>
</head>
<body class="login-page">
  <form class="login-card" method="post" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>CEA LA 30</h1>
    <p class="sub">Centro de Enseñanza Automovilística</p>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}<div class="alerta {{ categoria }}">{{ texto }}</div>{% endfor %}
    {% endwith %}

    <div class="field">
      <label class="lbl" for="usuario">Usuario</label>
      <input class="input-clean" id="usuario" name="usuario" required autofocus autocomplete="username" autocapitalize="none">
    </div>
    <div class="field">
      <label class="lbl" for="password">Contraseña</label>
      <input class="input-clean" id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <button class="btn-action red" type="submit" style="width:100%;margin-top:.5rem">Ingresar al sistema</button>
  </form>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js",{scope:"/"}).catch(function(){});</script>
</body>
</html>
