<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b48a3d">
  <title>Ingresar — CEA Practicar</title>
  <link rel="stylesheet" href="./static/css/app.css">
  <script>
    (function(){try{var t=localStorage.getItem('tema');if(t==='night'||t==='light'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();
  </script>
</head>
<body class="login-page">
  <main class="login-card">
    <h1>CEA PRACTICAR</h1>
    <p class="sub">Centro de Enseñanza Automovilística</p>

    <form id="login-preview" autocomplete="on">
      <div class="field">
        <label class="lbl" for="usuario">Usuario</label>
        <input class="input-clean" id="usuario" name="usuario" required autofocus autocomplete="username" autocapitalize="none">
      </div>
      <div class="field">
        <label class="lbl" for="password">Contraseña</label>
        <input class="input-clean" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn-action red" type="submit" style="width:100%;margin-top:.5rem">Ingresar al sistema</button>
    </form>

    <p class="hint" style="text-align:center;margin-top:1rem">Vista previa visual: el acceso no valida credenciales.</p>
  </main>
  <script>
    document.getElementById("login-preview").addEventListener("submit", function (event) {
      event.preventDefault();
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
